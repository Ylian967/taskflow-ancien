name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Seuil bloquant de couverture des lignes (tests unitaires de l'API), en %.
  COVERAGE_MIN: 78

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # On garde le verdict des deux versions même si l'une échoue.
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Tests unitaires et couverture
        run: npm run test:coverage

      - name: Couverture (résumé et seuil)
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          summary=coverage/coverage-summary.json
          pct() { jq -r ".total.$1.pct" "$summary"; }
          lines=$(pct lines)
          {
            echo "### Couverture de l'API (Node ${NODE_VERSION})"
            echo
            echo "| Mesure | Couverture |"
            echo "| --- | ---: |"
            echo "| Lignes | $(pct lines) % |"
            echo "| Instructions | $(pct statements) % |"
            echo "| Fonctions | $(pct functions) % |"
            echo "| Branches | $(pct branches) % |"
            echo
            echo "Seuil bloquant sur les lignes : **${COVERAGE_MIN} %**"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v p="$lines" -v min="$COVERAGE_MIN" 'BEGIN { exit !(p < min) }'; then
            echo "::error title=Couverture insuffisante::lignes ${lines} % < ${COVERAGE_MIN} %"
            exit 1
          fi
          echo "Couverture des lignes : ${lines} % (seuil ${COVERAGE_MIN} %)"

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Base jetable, détruite à la fin du job : pas un secret.
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        # Les steps tournent sur la VM, pas dans un conteneur : on publie le port.
        ports:
          - 5432:5432
        # Le job n'attaque les steps qu'une fois la base prête (healthy), pas juste démarrée.
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
    defaults:
      run:
        working-directory: api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests d'intégration (PostgreSQL)
        run: npm run test:int

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Tests
        run: npm run test:coverage

      - name: Build (Vite)
        run: npm run build

      - name: Conserver le build (artefact front-dist)
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          # upload-artifact ignore working-directory : chemin depuis la racine.
          path: front/dist/
          retention-days: 7
          if-no-files-found: error
